[project]
name = "graph-mvp"
version = "0.1.0"
description = "LLM-native operational intelligence for HVAC distributors"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "tqdm>=4.66.5",
    "pdfplumber>=0.11.0",
    "faker>=30.0.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "pymupdf>=1.24.0",
    "lancedb>=0.13.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
voyage = [
    "voyageai>=0.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
