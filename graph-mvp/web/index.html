<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph — Operational Intelligence for HVAC Distribution</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-mark">G</span>
                <span class="brand-name">Graph</span>
                <span class="brand-tag">Operational intelligence</span>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                <span class="status-text">Connected</span>
            </div>
        </div>
    </header>

    <main class="app">
        <section id="conversation" class="conversation">
            <div id="empty-state" class="empty-state">
                <h1 class="empty-title">Ask anything about your operations.</h1>
                <p class="empty-sub">
                    Graph reads your living wiki and your ERP data to answer in seconds,
                    with full source citations.
                </p>
                <div class="suggested">
                    <p class="suggested-label">Try a question:</p>
                    <div class="suggested-grid">
                        <button class="suggested-card" data-q="What's our exposure to the R-410A phase-out, and which 5 customers are most affected?">
                            <span class="suggested-tag">Refrigerant</span>
                            <span class="suggested-q">What's our exposure to the R-410A phase-out, and which 5 customers are most affected?</span>
                        </button>
                        <button class="suggested-card" data-q="Show me suppliers we depend on for more than 20% of a single category.">
                            <span class="suggested-tag">Supply chain</span>
                            <span class="suggested-q">Show me suppliers we depend on for more than 20% of a single category.</span>
                        </button>
                        <button class="suggested-card" data-q="Top 5 customers by revenue, with their segment and region.">
                            <span class="suggested-tag">Revenue</span>
                            <span class="suggested-q">Top 5 customers by revenue, with their segment and region.</span>
                        </button>
                        <button class="suggested-card" data-q="How many capacitors do we stock at the Atlanta warehouse, and what's the total on-hand value?">
                            <span class="suggested-tag">Inventory</span>
                            <span class="suggested-q">How many capacitors do we stock at the Atlanta warehouse, and what's the total on-hand value?</span>
                        </button>
                    </div>
                </div>
            </div>
            <div id="messages" class="messages" aria-live="polite"></div>
        </section>

        <form id="composer" class="composer">
            <div class="composer-inner">
                <textarea
                    id="question"
                    name="question"
                    rows="1"
                    autocomplete="off"
                    placeholder="Ask about exposure, suppliers, customers, refrigerants…"
                    required
                ></textarea>
                <button id="send-button" type="submit" class="send-button" aria-label="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
            <div class="composer-hint">
                Press <kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for newline
            </div>
        </form>
    </main>

    <aside id="sources-panel" class="sources-panel" aria-hidden="true">
        <div class="sources-header">
            <div>
                <p class="sources-eyebrow">Audit trail</p>
                <h2 id="sources-title" class="sources-title">Sources</h2>
            </div>
            <button id="sources-close" class="sources-close" aria-label="Close sources">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="sources-body" class="sources-body"></div>
    </aside>
    <div id="sources-scrim" class="sources-scrim" aria-hidden="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
